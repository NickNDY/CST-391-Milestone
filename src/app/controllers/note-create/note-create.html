<form id="updateForm" method="post">
    <div class="form-group">
        <label for="title" style="width: 90%; margin-left: auto; margin-right: auto;">Title</label><br>
        <input type="text" class="form-control" id="title" name="title" required style="width: 90%; margin-left: auto; margin-right: auto;"><br>
    </div>
    <div class="form-group">
        <label for="content" style="width: 90%; margin-left: auto; margin-right: auto;">Content</label><br>
        <textarea id="content" class="form-control" name="content" required style="width: 90%; margin-left: auto; margin-right: auto;" rows="30"></textarea><br>
    </div>
    <input type="submit" value="Submit" class="btn btn-primary">
</form>
